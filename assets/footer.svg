<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-labelledby="footer-title footer-desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="footer-title">Always learning, always building</title>
  <desc id="footer-desc">Dark footer with circuit accents and a short closing message from Md. Kaif Hosen Topader.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#080B14"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="140" fill="url(#bg)"/>

  <!-- Top neon rule -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#line)"/>

  <!-- Circuit traces on both sides -->
  <g fill="none" stroke="#00E5FF" stroke-opacity="0.18" stroke-width="2" stroke-linejoin="round">
    <path d="M0 70 H200 L230 40 H380"/>
    <path d="M0 104 H140 L168 132 H300"/>
    <path d="M1200 70 H1000 L970 40 H820"/>
    <path d="M1200 104 H1060 L1032 132 H900"/>
  </g>
  <g fill="#00E5FF" fill-opacity="0.6">
    <circle cx="200" cy="70" r="3"/>
    <circle cx="380" cy="40" r="3"/>
    <circle cx="300" cy="132" r="3"/>
    <circle cx="1000" cy="70" r="3"/>
    <circle cx="820" cy="40" r="3"/>
    <circle cx="900" cy="132" r="3"/>
  </g>

  <!-- Closing message -->
  <text x="600" y="58" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="900" fill="#F8FAFC">Md. Kaif Hosen Topader</text>
  <text x="600" y="88" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#00E5FF">Always learning. Always building.</text>
  <text x="600" y="118" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#94A3B8">Thanks for visiting. Let's connect and build something great together.</text>

  <!-- Bottom neon rule -->
  <rect x="0" y="138" width="1200" height="2" fill="#00E5FF" fill-opacity="0.5"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
