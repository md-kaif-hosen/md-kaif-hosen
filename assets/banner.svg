<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="banner-title banner-desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="banner-title">Md. Kaif Hosen Topader - Aspiring Software Engineer</title>
  <desc id="banner-desc">Futuristic dark banner with circuit patterns and neon cyan accents, introducing Md. Kaif Hosen Topader as a CSE student and aspiring software engineer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B14"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#00E5FF" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200"/>
    <path d="M100 0 V320 M200 0 V320 M300 0 V320 M400 0 V320 M500 0 V320 M600 0 V320 M700 0 V320 M800 0 V320 M900 0 V320 M1000 0 V320 M1100 0 V320"/>
  </g>

  <!-- Circuit traces -->
  <g fill="none" stroke="#00E5FF" stroke-opacity="0.22" stroke-width="2" stroke-linejoin="round">
    <path d="M0 52 H180 L220 92 H420 L450 122 H560"/>
    <path d="M0 268 H150 L190 228 H360 L392 196 H520"/>
    <path d="M1200 46 H1010 L970 86 H860 L832 114 H720"/>
    <path d="M1200 272 H1040 L1002 234 H900"/>
    <path d="M640 0 V40 L660 60 V96"/>
    <path d="M300 320 V286 L320 266 V250"/>
  </g>
  <g fill="#00E5FF" fill-opacity="0.6">
    <circle cx="180" cy="52" r="3"/>
    <circle cx="420" cy="92" r="3"/>
    <circle cx="560" cy="122" r="3"/>
    <circle cx="150" cy="268" r="3"/>
    <circle cx="520" cy="196" r="3"/>
    <circle cx="1010" cy="46" r="3"/>
    <circle cx="860" cy="86" r="3"/>
    <circle cx="720" cy="114" r="3"/>
    <circle cx="1040" cy="272" r="3"/>
    <circle cx="900" cy="234" r="3"/>
  </g>

  <!-- Accent rule -->
  <rect x="80" y="104" width="520" height="2" fill="url(#rule)"/>

  <!-- Name -->
  <text x="80" y="92" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="4" fill="#00E5FF">CSE STUDENT  |  PRIME UNIVERSITY</text>
  <text x="80" y="170" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="900" fill="#F8FAFC">Md. Kaif Hosen Topader</text>
  <text x="80" y="228" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="url(#accent)">Aspiring Software Engineer</text>

  <!-- Subtitle -->
  <text x="80" y="270" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#94A3B8">Bangladesh</text>

  <!-- Right-side terminal panel -->
  <g>
    <rect x="860" y="70" width="260" height="180" rx="14" fill="#101827" fill-opacity="0.85" stroke="#00E5FF" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="860" y="70" width="260" height="30" rx="14" fill="#00E5FF" fill-opacity="0.08"/>
    <circle cx="882" cy="85" r="5" fill="#8B5CF6"/>
    <circle cx="900" cy="85" r="5" fill="#2563EB"/>
    <circle cx="918" cy="85" r="5" fill="#00E5FF"/>
    <text x="890" y="142" font-family="'Consolas', 'Courier New', monospace" font-size="18" fill="#00E5FF">&lt;dev /&gt;</text>
    <text x="890" y="172" font-family="'Consolas', 'Courier New', monospace" font-size="15" fill="#F8FAFC">C  |  C++  |  Python</text>
    <text x="890" y="198" font-family="'Consolas', 'Courier New', monospace" font-size="15" fill="#94A3B8">HTML5  |  CSS3  |  Java</text>
    <text x="890" y="226" font-family="'Consolas', 'Courier New', monospace" font-size="13" fill="#8B5CF6">$ learning_path --continue</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="316" width="1200" height="4" fill="url(#accent)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
